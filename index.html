<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vesper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/utility.css" />
    <link rel="stylesheet" href="css/media.css" />
  </head>
  <body>
    <main>
      <header>
        <nav>
          <div class="logo">
            <h1>Vesper</h1>
          </div>
          <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Collections</a></li>
            <li><a href="#">Craftsmanship</a></li>
            <li><a href="#">Story</a></li>
            <li><a href="#">Reviews</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
          <div class="nav-right">
            <button class="theme-toggle" aria-label="Toggle Theme">
              <div class="toggle-thumb">
                <i class="fa-solid fa-moon" style="color: rgb(242, 243, 245);"></i>
              </div>
            </button>

            <button class="cart-btn">
              <i class="fa-solid fa-bag-shopping"></i>
              <span class="cart-count">0</span>
            </button>
          </div>

          <div class="burger">
            <div class="line1 line"></div>
            <div class="line2 line"></div>
            <div class="line3 line"></div>
          </div>
        </nav>
      </header>
    </main>

    <div class="cursor">
      <div class="dot"></div>
      <div class="ring"></div>
    </div>
    <div class="loader">
      <div class="loader-blob"></div>
      <div class="loader-blob blob-2"></div>
      <div class="loader-content">
        <h1 class="loader-logo">
          <span>V</span>
          <span>E</span>
          <span>S</span>
          <span>P</span>
          <span>E</span>
          <span>R</span>
        </h1>
        <p class="loader-tagline">Crafted For Precision</p>
        <div class="loader-progress">
          <div class="loader-progress-fill"></div>
        </div>
        <h2 class="loader-percentage">0%</h2>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script src="animation.js"></script>
    <script src="script.js"></script>
  </body>
</html>
